name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version && go env GOTOOLCHAIN GOROOT

      - name: Vet
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          go vet $pkgs

      - name: Test
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          go test -count=1 $pkgs
