name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version && go env GOTOOLCHAIN GOROOT

      - name: Module integrity
        run: |
          go mod tidy -diff
          go mod verify

      - name: Format
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"

      - name: Vet
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          go vet $pkgs

      - name: Test
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          go test -count=1 -coverprofile=coverage.out $pkgs
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$total" 'BEGIN { if (total < 20) { printf "coverage %.1f%% is below 20%%\n", total; exit 1 } }'

      - name: Race
        run: |
          pkgs=$(go list ./... | grep -v '/example/')
          go test -count=1 -race $pkgs

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          pkgs=$(go list ./... | grep -v '/example/')
          staticcheck $pkgs

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          pkgs=$(go list ./... | grep -v '/example/')
          govulncheck $pkgs
